<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TVs de cada época</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #111; color: #ddd; font-family: sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
  #abas { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px; }
  #abas button { background: #222; color: #ddd; border: 1px solid #444; padding: 6px 12px; cursor: pointer; }
  #abas button.ativa { background: #ddd; color: #111; }
  #palco { position: relative; width: min(90vw, 800px); }
  #palco > img { width: 100%; display: block; }
  #tela { position: absolute; overflow: hidden; background: #000; }
  #tela > * { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }
  #chuvisco { display: none; }
  #moldura { width: 100%; aspect-ratio: 4/3; background: #4a3a2a; border-radius: 4%; }
  #controles { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 16px; }
  #controles button, #controles input { font-size: 16px; }
  #controles button { padding: 8px 14px; cursor: pointer; }
  #fechar { position: fixed; top: 10px; right: 10px; z-index: 10; background: #a22; color: #fff; border: 0; padding: 8px 14px; cursor: pointer; }
  #texto { width: min(90vw, 800px); padding: 0 0 32px; line-height: 1.5; }
  #texto a { color: #8cf; }
  #info { padding: 4px; opacity: .6; font-size: 14px; }
</style>
</head>
<body>
<button id="fechar" title="Fechar a página">✕ Fechar</button>
<div id="abas"></div>
<div id="palco"></div>
<div id="info"></div>
<div id="controles"></div>
<div id="texto"></div>
<script src="imagens.js"></script>
<script src="tvs.js"></script>
<script src="sinais.js"></script>
<script src="motor.js"></script>
</body>
</html>
